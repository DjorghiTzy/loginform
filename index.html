<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b1b3a" />
<title>Logo — Login</title>
<meta name="description" content="Halaman landing dengan video background HD dan form login glassmorphism." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="assets/css/style.css" />
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
</head>
<body>

  <!-- ===== VIDEO BACKGROUND ===== -->
  <div class="bg-wrapper">
    <!-- Fallback gradient (tampil kalau video belum ada / gagal load) -->
    <div class="bg-fallback" aria-hidden="true">
      <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
      <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
      <span class="star s7"></span><span class="star s8"></span><span class="star s9"></span>
    </div>

    <!-- >>> TARUH VIDEO KAMU DI: assets/video/background.mp4 (opsional: background.webm) <<< -->
    <video id="bgVideo" class="bg-video" autoplay muted loop playsinline preload="auto"
           poster="assets/img/poster.svg">
      <source src="assets/video/background.webm" type="video/webm" />
      <source src="assets/video/background.mp4" type="video/mp4" />
    </video>

    <div class="bg-overlay" aria-hidden="true"></div>
  </div>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <a href="#" class="logo">Logo</a>

    <button class="nav-toggle" id="navToggle" aria-label="Buka menu" aria-expanded="false" aria-controls="navMenu">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-menu" id="navMenu">
      <ul class="nav-links">
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
      <button class="btn-login-nav" id="openLogin" type="button">Login</button>
    </nav>
  </header>

  <!-- ===== LOGIN MODAL ===== -->
  <div class="modal-backdrop" id="modalBackdrop"></div>

  <main class="modal-wrapper is-open" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <section class="login-card">
      <button class="close-btn" id="closeLogin" type="button" aria-label="Tutup">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        </svg>
      </button>

      <h1 class="login-title" id="loginTitle">Login</h1>

      <form id="loginForm" novalidate>
        <div class="field">
          <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required />
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
              <path d="M3 7l9 6 9-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </div>

        <div class="field">
          <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required />
          <span class="field-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <rect x="4.5" y="10" width="15" height="10" rx="2.5" fill="currentColor"/>
              <path d="M8 10V7.5a4 4 0 118 0V10" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
          </span>
        </div>

        <p class="form-error" id="formError" role="alert"></p>

        <div class="form-row">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot">Forget Password?</a>
        </div>

        <button type="submit" class="btn-submit">Login</button>

        <p class="register-text">Don't have an account? <a href="#">Register</a></p>
      </form>
    </section>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
